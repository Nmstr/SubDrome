[package]
name = "SubDrome"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
keyring = "4.1.6"
md5 = "0.8.1"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slint = "1.17.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread"] }

[build-dependencies]
slint-build = "1.17.1"

[profile.release]
codegen-units = 1
lto = true
